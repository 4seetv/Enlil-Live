name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prevent Expo Image-Utils Error (Create Fallback Assets)
        run: |
          mkdir -p assets
          # إنشاء صورة PNG صالحة بحجم 1x1 بكسل عبر Base64 لتجنب أي حاجة لأدوات خارجية
          PNG_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          if [ ! -f assets/icon.png ]; then echo "$PNG_B64" | base64 -d > assets/icon.png; fi
          if [ ! -f assets/adaptive-icon.png ]; then echo "$PNG_B64" | base64 -d > assets/adaptive-icon.png; fi
          if [ ! -f assets/splash.png ]; then echo "$PNG_B64" | base64 -d > assets/splash.png; fi

      - name: Generate Android Folder
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Grant Execute Permissions to Gradle
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enlil-Live-Release
          path: android/app/build/outputs/apk/release/app-release.apk
