name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Add 4GB Swap Space (The Ultimate OOM Fix)
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prevent Expo Image-Utils Error
        run: |
          mkdir -p assets
          PNG_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          if [ ! -f assets/icon.png ]; then echo "$PNG_B64" | base64 -d > assets/icon.png; fi
          if [ ! -f assets/adaptive-icon.png ]; then echo "$PNG_B64" | base64 -d > assets/adaptive-icon.png; fi
          if [ ! -f assets/splash.png ]; then echo "$PNG_B64" | base64 -d > assets/splash.png; fi

      - name: Generate Android Folder (Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Configure Strict Gradle Limits (Single Thread)
        working-directory: ./android
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties

      - name: Build APK (Release)
        working-directory: ./android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --stacktrace
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enlil-Live-Release
          path: android/app/build/outputs/apk/release/app-release.apk
