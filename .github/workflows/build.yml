name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Prevent Expo Image-Utils Error (Create Fallback Assets)
        run: |
          mkdir -p assets
          PNG_B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          if [ ! -f assets/icon.png ]; then echo "$PNG_B64" | base64 -d > assets/icon.png; fi
          if [ ! -f assets/adaptive-icon.png ]; then echo "$PNG_B64" | base64 -d > assets/adaptive-icon.png; fi
          if [ ! -f assets/splash.png ]; then echo "$PNG_B64" | base64 -d > assets/splash.png; fi

      - name: Generate Android Folder (Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Configure Gradle Memory Limits (Fix OOM Crash)
        working-directory: ./android
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      - name: Grant Execute Permissions to Gradle
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace --max-workers=2
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enlil-Live-Release
          path: android/app/build/outputs/apk/release/app-release.apk
